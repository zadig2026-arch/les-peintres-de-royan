name: Compress images

on:
  push:
    branches: [main]
    paths:
      - "public/images/**"
      - "scripts/compress-images.mjs"
      - ".github/workflows/compress-images.yml"

concurrency:
  group: compress-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    # Skip if the previous commit was already this workflow, to avoid a loop.
    if: "!contains(github.event.head_commit.message, '[skip-compress]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Compress changed images
        run: node scripts/compress-images.mjs

      - name: Commit compressed images
        run: |
          if git diff --quiet -- public/images; then
            echo "Aucune image à recompresser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Compresse automatiquement les images ajoutées [skip-compress]"
          # main bouge souvent (ajouts d'œuvres via l'admin) : si le push est refusé
          # parce que la branche a avancé, on rebase et on réessaie.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi."
              exit 0
            fi
            echo "Push refusé (main a bougé). Rebase et nouvelle tentative ($attempt/5)…"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Conflit lors du rebase, abandon."
              exit 1
            fi
          done
          echo "Échec du push après 5 tentatives."
          exit 1
